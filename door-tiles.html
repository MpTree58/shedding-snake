<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>门瓦片全览 · 选型</title>
    <style>
      body { background: #dff6f5; color: #20344a; font-family: monospace; padding: 16px; max-width: 1000px; margin: 0 auto; }
      h2 { font-size: 15px; border-bottom: 2px solid #20344a; padding-bottom: 4px; }
      .cell { display: inline-block; text-align: center; margin: 4px; vertical-align: top; }
      .cell img { width: 72px; height: 72px; image-rendering: pixelated; background: #c2e3e8; }
      .cell span { display: block; font-size: 12px; font-weight: bold; }
      .combo { display: inline-block; text-align: center; margin: 10px 18px; vertical-align: bottom; }
      .combo .stack { display: flex; flex-direction: column; width: 108px; }
      .combo img { width: 108px; height: 108px; image-rendering: pixelated; display: block; }
      .combo span { display: block; font-size: 13px; margin-top: 6px; font-weight: bold; }
      .note { font-size: 13px; color: #537089; }
    </style>
  </head>
  <body>
    <h2>一、瓦片区 104–160 全览(门在这个区间,看编号)</h2>
    <div id="grid"></div>

    <h2>二、候选组合方案(灰底 = 天空色,模拟游戏里的样子)</h2>
    <div id="combos"></div>
    <p class="note">
      组合说明:A = 现状(130 上 + 150 下,两格高);B = 只用 150 单格;C = 只用 130 单格;
      D = 110 上 + 130 下;E = 130 上 + 150 下再垫草地(看落地效果)。
      看完告诉我用哪个,或者你有别的拼法。
    </p>

    <script>
      const T = (n) => `/assets-preview/pixel-platformer/Tiles/tile_${String(n).padStart(4, '0')}.png`;
      const grid = document.getElementById('grid');
      for (let i = 104; i <= 160; i++) {
        const d = document.createElement('div');
        d.className = 'cell';
        d.innerHTML = `<img src="${T(i)}" onerror="this.parentNode.remove()"><span>${i}</span>`;
        grid.appendChild(d);
      }
      const combos = document.getElementById('combos');
      const combo = (label, stack) => {
        const d = document.createElement('div');
        d.className = 'combo';
        d.innerHTML =
          `<div class="stack">` +
          stack.map((n) => `<img src="${T(n)}">`).join('') +
          `</div><span>${label}</span>`;
        combos.appendChild(d);
      };
      combo('A · 130+150(现状)', [130, 150]);
      combo('B · 只用 150', [150]);
      combo('C · 只用 130', [130]);
      combo('D · 110+130', [110, 130]);
      combo('E · 130+150+草地', [130, 150, 0]);
    </script>
  </body>
</html>
